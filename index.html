<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9f7"><meta name="description" content="Orbe — gestão simples para pequenos negócios.">
<title>Orbe · Gestão simples</title>
<link rel="manifest" href="./manifest.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
<style>
:root{--green:#16734d;--green-dark:#105a3b;--mint:#e8f4ed;--mint2:#f2f8f4;--ink:#18231d;--muted:#78847d;--line:#e8ede9;--paper:#fff;--bg:#f6f8f6;--orange:#a76718;--orange-bg:#fff4e5;--red:#b53d3d;--red-bg:#fff0ef;--blue:#416c9a;--blue-bg:#edf4fb;--shadow:0 8px 30px rgba(24,50,35,.055)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.topbar{height:66px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 760px)/2));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.5px;font-size:18px}.brand-icon{width:34px;height:34px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:19px}.top-left{display:flex;align-items:center;gap:12px}.back{width:38px;height:38px;border:0;border-radius:13px;background:var(--mint);color:var(--green);font-size:25px;line-height:1}.top-title{font-weight:750;font-size:16px}.top-actions{display:flex;gap:8px}
.page{width:min(100% - 32px,720px);margin:0 auto;padding:26px 0 calc(42px + env(safe-area-inset-bottom))}
.greeting{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 22px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}h1{font-size:27px;letter-spacing:-1.1px;line-height:1.12;margin:5px 0 6px}h2{font-size:18px;letter-spacing:-.45px;margin:0}.sub{color:var(--muted);font-size:13px}.date-chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);font-size:11px;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}.stat{border:1px solid var(--line);background:#fff;border-radius:19px;padding:16px;min-height:116px;box-shadow:var(--shadow)}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--mint);color:var(--green)}.stat-value{font-size:23px;letter-spacing:-.8px;font-weight:820;margin:13px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-foot{font-size:11px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-link{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:750;padding:7px 0}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.action-card{border:1px solid var(--line);background:#fff;border-radius:19px;min-height:116px;text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}.action-card:active{transform:scale(.98)}.action-icon{height:37px;width:37px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:750}.action-card strong{font-size:15px;display:block;margin-top:12px}.action-card small{font-size:11px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}.list-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0;padding-bottom:0}.list-row:first-child{padding-top:2px}.row-main{flex:1;min-width:0}.row-title{font-size:13px;font-weight:720;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-meta{font-size:11px;color:var(--muted);margin-top:3px}.row-end{text-align:right;white-space:nowrap;font-size:13px;font-weight:750}
.avatar{height:38px;width:38px;flex:0 0 38px;border-radius:13px;background:var(--mint2);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:750;background:var(--mint);color:var(--green);white-space:nowrap}.badge.warn{background:var(--orange-bg);color:var(--orange)}.badge.danger{background:var(--red-bg);color:var(--red)}.badge.blue{background:var(--blue-bg);color:var(--blue)}
.screen-head{margin-bottom:19px}.screen-head h1{margin:5px 0}.screen-head .sub{margin-top:5px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:730;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.soft{background:var(--mint);border-color:var(--mint);color:var(--green)}.btn.danger{background:var(--red-bg);border-color:var(--red-bg);color:var(--red)}.btn.block{width:100%}.btn.small{padding:8px 10px;font-size:11px;border-radius:10px}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:13px}.search{height:45px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:0 13px;outline:none;width:100%;font-size:13px}.search:focus,.field input:focus,.field select:focus{border-color:#87b99d;box-shadow:0 0 0 3px #16734d12}
.product-list,.customer-list{display:grid;gap:10px}.product-card{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px}.product-symbol{width:44px;height:44px;border-radius:14px;background:var(--mint2);display:grid;place-items:center;color:var(--green);font-size:19px;flex:0 0 44px}.product-info{flex:1;min-width:0}.product-name{font-size:14px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-meta{font-size:11px;color:var(--muted);margin-top:4px}.product-price{text-align:right;font-weight:780;font-size:13px;white-space:nowrap}.product-actions{display:flex;gap:6px;margin-top:7px;justify-content:flex-end}
.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:#56635b;font-weight:750}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;outline:none;color:var(--ink);font-size:13px}.field textarea{min-height:70px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.field.full{grid-column:1/-1}
.empty{padding:27px 16px;text-align:center;color:var(--muted);font-size:13px}.empty-icon{font-size:25px;margin-bottom:8px;color:#9aa79f}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.cart-line:last-child{border-bottom:0}.qty-control{display:flex;align-items:center;gap:9px}.qty-control button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800;color:var(--green)}.cart-line select{margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:11px;background:#fff;color:var(--muted)}
.total-line{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:13px}.total-line strong{font-size:20px;letter-spacing:-.6px}
.sticky-action{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding:18px 0 calc(6px + env(safe-area-inset-bottom));margin-top:12px}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:500px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fbfcfb}tr:last-child td{border-bottom:0}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,28,20,.42);display:none;align-items:flex-end;justify-content:center;padding:12px}.overlay.open{display:flex}.sheet{background:#fff;border-radius:23px 23px 18px 18px;width:min(100%,560px);max-height:min(90dvh,850px);overflow:auto;padding:21px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 70px #0002}.sheet-handle{width:38px;height:4px;background:#dce4de;border-radius:4px;margin:-9px auto 17px}.sheet h2{margin-bottom:4px}.sheet .sub{margin-bottom:17px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#1b2921;color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;box-shadow:0 8px 28px #0002;max-width:calc(100% - 30px);display:none}
.welcome{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}.welcome-card{width:min(100%,440px);padding:25px;border:1px solid var(--line);background:#fff;border-radius:24px;box-shadow:var(--shadow)}.welcome-card h1{font-size:27px;margin:18px 0 8px}.welcome-card .btn{width:100%;margin-top:10px;padding:14px}.welcome-logo{height:45px;width:45px;border-radius:15px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:24px}
.secondary-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.secondary-links button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 6px;color:#526158;font-size:11px;font-weight:700}
.install{border:0;background:var(--mint);color:var(--green);font-weight:750;border-radius:11px;padding:9px 11px;font-size:11px}
@media(min-width:700px){.page{padding-top:34px}.stats{grid-template-columns:repeat(4,1fr)}.stat{min-height:125px}.actions-grid{grid-template-columns:repeat(4,1fr)}.action-card{min-height:130px}.greeting h1{font-size:31px}}
@media(max-width:390px){.page{width:calc(100% - 24px);padding-top:20px}.stat{padding:13px;min-height:108px}.stat-value{font-size:20px}.date-chip{display:none}.action-card{padding:13px;min-height:108px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar" id="topbar"><div class="top-left"><div class="brand"><span class="brand-icon">◉</span><span>orbe</span></div></div><div class="top-actions"><button class="install" id="install-btn">Instalar app</button></div></header>
<main class="page" id="app"><div class="panel">A iniciar o Orbe…</div></main>
<section class="welcome" id="welcome"><div class="welcome-card"><div class="welcome-logo">◉</div><div class="eyebrow" style="margin-top:17px">Primeira configuração</div><h1>Onde queres guardar os dados?</h1><p class="sub">O Orbe guarda os teus registos neste dispositivo. Num computador compatível, também podes escolher uma pasta para manter uma cópia SQLite.</p><button class="btn primary block" id="device-storage">Guardar neste dispositivo</button><button class="btn block" id="folder-storage" style="display:none">Escolher pasta no computador</button><p class="sub" style="margin:14px 0 0">Não precisas de criar conta. Os dados ficam no teu dispositivo.</p></div></section>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
(()=> {
const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:state.cfg.currency||'AOA',maximumFractionDigits:0}).format(Number(n)||0),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={db:null,kv:null,folder:null,page:'home',products:[],sales:[],customers:[],moves:[],expenses:[],cfg:{business:'O meu negócio',currency:'AOA',minimum:5},cart:[],query:''};
let installPrompt=null,toastTimer=null;
function notify(s){const el=$('#toast');el.textContent=s;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2500)}
function openKV(){return new Promise((resolve,reject)=>{const r=indexedDB.open('orbe-sqlite-store',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{state.kv=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function kvGet(k){return new Promise((resolve,reject)=>{const r=state.kv.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function kvPut(k,v){return new Promise((resolve,reject)=>{const r=state.kv.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function saveDB(){const bytes=state.db.export();await kvPut('database',bytes);if(state.folder){try{let p=await state.folder.queryPermission({mode:'readwrite'});if(p!=='granted')p=await state.folder.requestPermission({mode:'readwrite'});if(p==='granted'){const f=await state.folder.getFileHandle('orbe.sqlite',{create:true}),w=await f.createWritable();await w.write(bytes);await w.close()}}catch(e){notify('Cópia na pasta indisponível. Dados locais preservados.')}}}
function rows(name){const r=state.db.exec('SELECT data FROM '+name);return r.length?r[0].values.map(x=>JSON.parse(x[0])):[]}
function write(name,obj){state.db.run('INSERT OR REPLACE INTO '+name+' (id,data) VALUES (?,?)',[String(obj.id||'main'),JSON.stringify(obj)])}
function remove(name,id){state.db.run('DELETE FROM '+name+' WHERE id=?',[String(id)])}
async function refresh(){state.products=rows('products');state.sales=rows('sales');state.customers=rows('customers');state.moves=rows('moves');state.expenses=rows('expenses');const s=rows('settings');if(s[0])state.cfg=s[0].value||state.cfg;else{write('settings',{id:'main',value:state.cfg});await saveDB()}}
async function initDB(){await openKV();let bytes=await kvGet('database');state.folder=await kvGet('folder-handle')||null;if(state.folder){try{const perm=await state.folder.queryPermission({mode:'readwrite'});if(perm==='granted'){const file=await state.folder.getFileHandle('orbe.sqlite');bytes=await(await file.getFile()).arrayBuffer()}}catch{}}
const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/'+f});state.db=bytes?new SQL.Database(new Uint8Array(bytes)):new SQL.Database();
for(const t of ['products','sales','customers','moves','settings','expenses'])state.db.run('CREATE TABLE IF NOT EXISTS '+t+' (id TEXT PRIMARY KEY, data TEXT NOT NULL)');
await refresh();if(!bytes)await saveDB();}
function go(page){state.page=page;state.query='';render()}
function topbar(){const names={home:'',sell:'Vender',products:'Produtos',stock:'Stock',customers:'Clientes',history:'Histórico',reports:'Relatórios',settings:'Definições'};const isHome=state.page==='home';$('#topbar').innerHTML='<div class="top-left">'+(isHome?'<div class="brand"><span class="brand-icon">◉</span><span>orbe</span></div>':'<button class="back" data-action="home" aria-label="Voltar">‹</button><span class="top-title">'+names[state.page]+'</span>')+'</div><div class="top-actions"><button class="install" id="install-btn">Instalar app</button></div>';$('#install-btn').onclick=installApp}
function screenHead(title,sub,action=''){return '<div class="screen-head"><div class="eyebrow">ORBE · '+(state.cfg.business||'O teu negócio')+'</div><h1>'+title+'</h1><div class="sub">'+sub+'</div>'+action+'</div>'}
function empty(icon,title,desc){return '<div class="empty"><div class="empty-icon">'+icon+'</div><strong>'+title+'</strong>'+desc+'</div>'}
function stat(label,value,foot,icon,color){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon" style="background:'+color+'">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-foot">'+foot+'</div></div>'}
function dashboard(){const ds=state.sales.filter(s=>s.date===today()),total=ds.reduce((n,s)=>n+(+s.total||0),0),profit=ds.reduce((n,s)=>n+(+s.profit||0),0),low=state.products.filter(p=>(+p.stock||0)<=(+p.minimum||0)),recent=state.sales.slice().sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,4);const d=new Intl.DateTimeFormat('pt-PT',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
return '<div class="greeting"><div><div class="eyebrow">O TEU NEGÓCIO, NUM SÓ LUGAR</div><h1>Olá, vamos trabalhar?</h1><div class="sub">'+esc(state.cfg.business)+' · '+d+'</div></div><span class="date-chip">● Dados neste dispositivo</span></div>'+
'<div class="stats">'+stat('Vendido hoje',fmt(total),ds.length+' venda(s)','↗','#e8f4ed')+stat('Lucro estimado',fmt(profit),'Margem dos produtos','◈','#edf4fb')+stat('Produtos',state.products.length,'No teu catálogo','▦','#f2effb')+stat('Stock baixo',low.length,low.length?'Precisa de atenção':'Tudo controlado','!','#fff4e5')+'</div>'+
'<div class="section-head"><h2>O que precisas fazer?</h2></div><div class="actions-grid">'+
'<button class="action-card" data-go="sell"><span class="action-icon" style="background:#e8f4ed;color:#16734d">＋</span><span><strong>Vender</strong><small>Registar uma venda</small></span></button>'+
'<button class="action-card" data-go="products"><span class="action-icon" style="background:#edf4fb;color:#416c9a">▦</span><span><strong>Produtos</strong><small>Preços e catálogo</small></span></button>'+
'<button class="action-card" data-go="stock"><span class="action-icon" style="background:#fff4e5;color:#a76718">▤</span><span><strong>Stock</strong><small>Entradas e ajustes</small></span></button>'+
'<button class="action-card" data-go="customers"><span class="action-icon" style="background:#f2effb;color:#7654a5">♙</span><span><strong>Clientes</strong><small>Contactos e compras</small></span></button></div>'+
'<div class="section-head"><h2>Movimento recente</h2><button class="section-link" data-go="history">Ver histórico →</button></div><div class="panel">'+(recent.length?recent.map(s=>'<div class="list-row" data-sale="'+s.id+'"><div class="avatar">↗</div><div class="row-main"><div class="row-title">'+esc(s.no||'Venda')+'</div><div class="row-meta">'+esc(s.customerName||'Venda sem cliente')+' · '+s.date+'</div></div><div class="row-end">'+fmt(s.total)+'<div class="row-meta">Ver detalhes</div></div></div>').join(''):empty('↗','Ainda não há vendas','As tuas vendas recentes vão aparecer aqui.'))+'</div>'+
'<div class="section-head"><h2>Stock a acompanhar</h2><button class="section-link" data-go="stock">Abrir stock →</button></div><div class="panel">'+(low.length?low.slice(0,4).map(p=>'<div class="list-row"><div class="avatar" style="background:#fff4e5;color:#a76718">!</div><div class="row-main"><div class="row-title">'+esc(p.name)+'</div><div class="row-meta">Mínimo: '+p.minimum+' unidades</div></div><span class="badge warn">'+p.stock+' em stock</span></div>').join(''):empty('✓','Sem alertas de stock','Nenhum produto está abaixo do mínimo.'))+'</div>'+
'<div class="section-head"><h2>Outras ferramentas</h2></div><div class="secondary-links"><button data-go="history">Histórico</button><button data-go="reports">Relatórios</button><button data-go="settings">Definições</button></div>'}
function productsPage(){const q=state.query.toLowerCase(),list=state.products.filter(p=>(p.name+' '+(p.category||'')).toLowerCase().includes(q));return screenHead('Os teus produtos','Organiza o catálogo, os preços e as quantidades.','<button class="btn primary block" data-action="new-product">＋ Adicionar produto</button>')+'<div class="toolbar" style="margin-top:14px"><input class="search" id="search-products" placeholder="Pesquisar produto ou categoria…" value="'+esc(state.query)+'"></div><div class="product-list">'+(list.length?list.map(p=>'<article class="product-card"><div class="product-symbol">▦</div><div class="product-info"><div class="product-name">'+esc(p.name)+'</div><div class="product-meta">'+esc(p.category||'Sem categoria')+' · '+p.stock+' un. em stock</div><div class="product-meta">Custo '+fmt(p.cost)+' · <b style="color:var(--green)">'+fmt(p.price)+'</b></div></div><div class="product-price"><span class="badge '+(p.stock<=p.minimum?'warn':'')+'">'+(p.stock<=p.minimum?'Stock baixo':'Disponível')+'</span><div class="product-actions"><button class="btn small" data-edit-product="'+p.id+'">Editar</button></div></div></article>').join(''):empty('▦','Nenhum produto encontrado','Adiciona o primeiro produto ao teu catálogo.'))+'</div>'}

function customersPage(){const q=state.query.toLowerCase(),list=state.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));return screenHead('Os teus clientes','O cadastro é opcional. Cada cliente guarda o seu histórico.','<button class="btn primary block" data-action="new-customer">＋ Adicionar cliente</button>')+'<div class="toolbar" style="margin-top:14px"><input class="search" id="search-customers" placeholder="Pesquisar nome ou telefone…" value="'+esc(state.query)+'"></div><div class="customer-list">'+(list.length?list.map(c=>{const ss=state.sales.filter(s=>s.customerId===c.id);return '<button class="product-card" style="width:100%;text-align:left" data-customer="'+c.id+'"><div class="avatar">'+esc(c.name.slice(0,1).toUpperCase())+'</div><div class="product-info"><div class="product-name">'+esc(c.name)+'</div><div class="product-meta">'+esc(c.phone||'Sem telefone')+' · '+ss.length+' compra(s)</div></div><div class="row-end">›</div></button>'}).join(''):empty('♙','Ainda não há clientes','Podes registar uma venda sem cadastrar cliente.'))+'</div>'}
function sellPage(){const q=state.query.toLowerCase(),avail=state.products.filter(p=>p.stock>0&&(p.name+' '+(p.category||'')).toLowerCase().includes(q)),sum=state.cart.reduce((n,x)=>n+x.price*x.qty,0);return screenHead('Nova venda','Adiciona produtos ao carrinho. Só confirmas depois de receber o pagamento.')+'<div class="field"><input class="search" id="search-sell" placeholder="⌕  Procurar produto…" value="'+esc(state.query)+'"></div><div class="product-list">'+(avail.length?avail.map(p=>'<button class="product-card" style="width:100%;text-align:left" data-add="'+p.id+'"><div class="product-symbol">＋</div><div class="product-info"><div class="product-name">'+esc(p.name)+'</div><div class="product-meta">'+p.stock+' unidades disponíveis</div></div><div class="product-price">'+fmt(p.price)+'</div></button>').join(''):empty('▦','Não há produtos disponíveis','Cria um produto ou ajusta a pesquisa.'))+'</div><div class="section-head"><h2>Carrinho <span class="badge">'+state.cart.reduce((n,x)=>n+x.qty,0)+' itens</span></h2><button class="section-link" data-action="clear-cart">Limpar</button></div><div class="panel">'+(state.cart.length?state.cart.map(x=>'<div class="cart-line"><div><div class="row-title">'+esc(x.name)+'</div><div class="row-meta">'+fmt(x.price)+' cada · '+fmt(x.price*x.qty)+'</div><label class="row-meta" style="display:block;margin-top:8px">Entrega deste produto <select data-cart-delivery="'+x.id+'"><option value="pending" '+(x.delivery==='pending'?'selected':'')+'>Pendente</option><option value="delivered" '+(x.delivery==='delivered'?'selected':'')+'>Entregue</option></select></label></div><div class="qty-control"><button data-dec="'+x.id+'">−</button><b>'+x.qty+'</b><button data-inc="'+x.id+'">＋</button></div></div>').join(''):'<div class="empty">O carrinho está vazio. Escolhe um produto acima.</div>')+'<div class="field"><label>Cliente (opcional)</label><select id="sale-customer"><option value="">Venda sem cliente</option>'+state.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>Forma de pagamento</label><select id="sale-method"><option>Dinheiro</option><option>Transferência</option><option>TPA</option><option>Outro</option></select></div><div class="total-line"><span>Total a receber</span><strong>'+fmt(sum)+'</strong></div><button class="btn primary block" data-action="finish-sale" '+(!state.cart.length?'disabled':'')+'>Confirmar venda paga · '+fmt(sum)+'</button></div>'}
function historyPage(){const sales=state.sales.slice().sort((a,b)=>(b.created||0)-(a.created||0));return screenHead('Histórico de vendas','Consulta vendas e altera o estado de entrega de cada produto.')+'<div class="panel">'+(sales.length?sales.map(s=>'<button class="list-row" style="width:100%;text-align:left;background:none;border:0" data-sale="'+s.id+'"><div class="avatar">↗</div><div class="row-main"><div class="row-title">'+esc(s.no||'Venda')+' · '+esc(s.customerName||'Sem cliente')+'</div><div class="row-meta">'+s.date+' · '+s.items.length+' produto(s)</div></div><div class="row-end">'+fmt(s.total)+'<div class="row-meta">'+(s.items.every(i=>i.delivery==='delivered')?'Entregue':'Entrega pendente')+'</div></div></button>').join(''):empty('↗','Sem vendas registadas','Quando fizeres uma venda, ela aparecerá aqui.'))+'</div>'}
function reportsPage(){const total=state.sales.reduce((n,s)=>n+(+s.total||0),0),profit=state.sales.reduce((n,s)=>n+(+s.profit||0),0),costs=state.expenses.reduce((n,e)=>n+(+e.amount||0),0);return screenHead('Resumo do negócio','Os números acumulados das vendas registadas.')+'<div class="stats">'+stat('Total vendido',fmt(total),'Vendas registadas','↗','#e8f4ed')+stat('Lucro estimado',fmt(profit),'Antes das despesas','◈','#edf4fb')+stat('Despesas',fmt(costs),'Despesas registadas','−','#fff4e5')+stat('Resultado',fmt(profit-costs),'Lucro menos despesas','=', '#f2effb')+'</div><div class="panel"><h2>Exportar os teus dados</h2><p class="sub">Guarda uma cópia ou abre as vendas numa folha de cálculo.</p><div class="toolbar" style="margin-top:15px"><button class="btn primary" data-action="export-csv">Exportar CSV</button><button class="btn" data-action="backup">Backup JSON</button></div><button class="btn block" data-action="print">Imprimir / Guardar PDF</button></div>'}
function settingsPage(){return screenHead('Definições','Personaliza o teu negócio e protege os teus dados.')+'<div class="panel"><form id="settings-form"><div class="field"><label>Nome do negócio</label><input name="business" value="'+esc(state.cfg.business)+'" required></div><div class="field"><label>Moeda</label><select name="currency">'+['AOA','BRL','EUR','USD','MZN','CVE'].map(x=>'<option '+(state.cfg.currency===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Alerta de stock baixo (unidades)</label><input name="minimum" type="number" min="0" value="'+state.cfg.minimum+'"></div><button class="btn primary block">Guardar definições</button></form></div><div class="panel"><h2>Armazenamento</h2><p class="sub">Os dados são guardados localmente em SQLite. A cópia na pasta depende das permissões do navegador.</p><button class="btn block" data-action="choose-folder-again">Escolher / alterar pasta de backup</button><button class="btn block" style="margin-top:9px" data-action="backup">Descarregar backup JSON</button><label class="btn block" style="margin-top:9px">Restaurar backup JSON<input type="file" id="restore-file" accept="application/json" hidden></label></div><div class="panel"><button class="btn danger block" data-action="reset">Apagar todos os dados deste dispositivo</button></div>'}
function render(){topbar();const views={home:dashboard,sell:sellPage,products:productsPage,stock:stockPage,customers:customersPage,history:historyPage,reports:reportsPage,settings:settingsPage};$('#app').innerHTML=(views[state.page]||dashboard)()}
function openSheet(html){$('#sheet').innerHTML='<div class="sheet-handle"></div>'+html;$('#overlay').classList.add('open')}
function closeSheet(){$('#overlay').classList.remove('open')}
function productForm(p){openSheet('<h2>'+(p?'Editar produto':'Novo produto')+'</h2><p class="sub">Define o nome, preço e quantidade inicial.</p><form id="product-form"><div class="field"><label>Nome do produto</label><input name="name" required maxlength="80" value="'+esc(p?.name||'')+'"></div><div class="field"><label>Categoria (opcional)</label><input name="category" value="'+esc(p?.category||'')+'"></div><div class="form-grid"><div class="field"><label>Preço de venda</label><input name="price" type="number" min="0" step=".01" required value="'+(p?.price??'')+'"></div><div class="field"><label>Custo unitário</label><input name="cost" type="number" min="0" step=".01" value="'+(p?.cost??0)+'"></div><div class="field"><label>Quantidade em stock</label><input name="stock" type="number" min="0" step="1" required value="'+(p?.stock??0)+'"></div><div class="field"><label>Alerta de stock</label><input name="minimum" type="number" min="0" step="1" value="'+(p?.minimum??state.cfg.minimum)+'"></div></div><button class="btn primary block" style="margin-top:10px">Guardar produto</button><button type="button" class="btn block" style="margin-top:8px" data-action="close-sheet">Cancelar</button></form>');$('#product-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),obj={id:p?.id||uid(),name:f.get('name').trim(),category:f.get('category').trim(),price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock'),minimum:+f.get('minimum')};if(!obj.name||obj.price<0||obj.stock<0)return notify('Confere os dados do produto.');if(p&&obj.stock!==p.stock){write('moves',{id:uid(),date:today(),created:Date.now(),name:obj.name,qty:obj.stock-p.stock,type:'Correção de stock',note:'Alteração no cadastro'});}else if(!p&&obj.stock>0){write('moves',{id:uid(),date:today(),created:Date.now(),name:obj.name,qty:obj.stock,type:'Stock inicial'});}write('products',obj);await saveDB();await refresh();closeSheet();render();notify('Produto guardado.')}}
function customerForm(){openSheet('<h2>Novo cliente</h2><p class="sub">O cliente é opcional nas vendas.</p><form id="customer-form"><div class="field"><label>Nome</label><input name="name" required maxlength="100"></div><div class="field"><label>Telefone (opcional)</label><input name="phone" inputmode="tel"></div><div class="field"><label>Observação (opcional)</label><textarea name="note"></textarea></div><button class="btn primary block">Guardar cliente</button><button type="button" class="btn block" style="margin-top:8px" data-action="close-sheet">Cancelar</button></form>');$('#customer-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);write('customers',{id:uid(),name:f.get('name').trim(),phone:f.get('phone').trim(),note:f.get('note').trim()});await saveDB();await refresh();closeSheet();render();notify('Cliente guardado.')}}
function adjustForm(p){openSheet('<h2>Movimentar stock</h2><p class="sub">'+esc(p.name)+' · Atual: '+p.stock+' unidades</p><form id="adjust-form"><div class="field"><label>Tipo de movimento</label><select name="type"><option value="entry">Entrada de stock</option><option value="set">Corrigir quantidade total</option><option value="remove">Retirar unidades</option></select></div><div class="field"><label>Quantidade</label><input name="qty" type="number" min="1" step="1" required></div><div class="field"><label>Nota (opcional)</label><input name="note"></div><button class="btn primary block">Guardar movimento</button><button type="button" class="btn block" style="margin-top:8px" data-action="close-sheet">Cancelar</button></form>');$('#adjust-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),q=+f.get('qty'),old=p.stock;if(!Number.isInteger(q)||q<1)return notify('Indica uma quantidade válida.');if(f.get('type')==='entry')p.stock+=q;else if(f.get('type')==='remove'){if(q>old)return notify('Não podes retirar mais do que existe em stock.');p.stock-=q}else p.stock=q;write('products',p);write('moves',{id:uid(),date:today(),created:Date.now(),name:p.name,qty:p.stock-old,type:f.get('type')==='entry'?'Entrada':f.get('type')==='remove'?'Saída manual':'Correção',note:f.get('note')});await saveDB();await refresh();closeSheet();render();notify('Stock atualizado.')}}
function saleDetails(s){openSheet('<h2>'+esc(s.no||'Detalhes da venda')+'</h2><p class="sub">'+s.date+' · '+esc(s.customerName||'Venda sem cliente')+' · '+esc(s.method||'')+'</p><div class="panel" style="box-shadow:none;margin:0 0 12px;padding:12px">'+s.items.map((i,n)=>'<div class="list-row"><div class="row-main"><div class="row-title">'+esc(i.name)+' × '+i.qty+'</div><div class="row-meta">'+fmt(i.price*i.qty)+'</div></div><select data-sale-delivery="'+n+'" style="border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11px"><option value="pending" '+(i.delivery==='pending'?'selected':'')+'>Pendente</option><option value="delivered" '+(i.delivery==='delivered'?'selected':'')+'>Entregue</option></select></div>').join('')+'</div><div class="total-line"><span>Total pago</span><strong>'+fmt(s.total)+'</strong></div><button class="btn block" data-action="close-sheet">Fechar</button>');$('#sheet').querySelectorAll('[data-sale-delivery]').forEach(sel=>sel.onchange=async()=>{s.items[+sel.dataset.saleDelivery].delivery=sel.value;write('sales',s);await saveDB();await refresh();saleDetails(s)})}
function customerDetails(c){const sales=state.sales.filter(s=>s.customerId===c.id);openSheet('<h2>'+esc(c.name)+'</h2><p class="sub">'+esc(c.phone||'Sem telefone')+'</p><div class="panel" style="box-shadow:none"><div class="row-title">Histórico de compras</div>'+ (sales.length?sales.map(s=>'<button class="list-row" style="width:100%;text-align:left;background:none;border:0" data-sale="'+s.id+'"><span class="row-main"><b>'+esc(s.no)+'</b><small class="row-meta" style="display:block">'+s.date+'</small></span><b>'+fmt(s.total)+'</b></button>').join(''):empty('◷','Sem compras','Este cliente ainda não tem compras.'))+'</div><button class="btn block" data-action="close-sheet">Fechar</button>')}
async function finishSale(){if(!state.cart.length)return notify('O carrinho está vazio.');for(const x of state.cart){const p=state.products.find(p=>p.id===x.id);if(!p||p.stock<x.qty)return notify('Stock insuficiente para '+x.name+'.');}const total=state.cart.reduce((n,x)=>n+x.price*x.qty,0);if(total<=0)return notify('O total da venda deve ser superior a zero.');const customerId=$('#sale-customer')?.value||'',customer=state.customers.find(c=>c.id===customerId),items=state.cart.map(x=>({id:x.id,name:x.name,qty:x.qty,price:x.price,cost:x.cost,delivery:x.delivery})),sale={id:uid(),no:'ORB-'+Date.now().toString().slice(-6),date:today(),created:Date.now(),customerId:customerId||null,customerName:customer?.name||'',items,total,profit:items.reduce((n,x)=>n+(x.price-x.cost)*x.qty,0),method:$('#sale-method')?.value||'Dinheiro',paid:true};
try{state.db.run('BEGIN TRANSACTION');for(const x of items){const p=state.products.find(p=>p.id===x.id);p.stock-=x.qty;write('products',p);write('moves',{id:uid(),date:today(),created:Date.now(),name:p.name,qty:-x.qty,type:'Venda',note:sale.no})}write('sales',sale);state.db.run('COMMIT');await saveDB();await refresh();state.cart=[];go('history');notify('Venda registada com sucesso.')}catch(e){try{state.db.run('ROLLBACK')}catch{}console.error(e);notify('Não foi possível registar a venda. Nada foi confirmado.');await refresh();render()}}
function backup(){const data={version:1,createdAt:new Date().toISOString(),products:state.products,sales:state.sales,customers:state.customers,moves:state.moves,expenses:state.expenses,settings:state.cfg};download('orbe-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json')}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function csv(){const rows=[['Venda','Data','Cliente','Produto','Quantidade','Preço unitário','Total item','Lucro item','Pagamento','Entrega']];state.sales.forEach(s=>s.items.forEach(i=>rows.push([s.no,s.date,s.customerName,i.name,i.qty,i.price,i.qty*i.price,i.qty*(i.price-i.cost),s.method,i.delivery])));download('orbe-vendas-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function restore(file){try{const d=JSON.parse(await file.text());for(const n of ['products','sales','customers','moves'])if(!Array.isArray(d[n]))throw new Error('Ficheiro inválido');if(!confirm('Substituir os dados deste dispositivo pelo backup?'))return;state.db.run('BEGIN TRANSACTION');for(const n of ['products','sales','customers','moves','expenses','settings']){state.db.run('DELETE FROM '+n);const arr=n==='settings'?[{id:'main',value:d.settings||state.cfg}]:d[n]||[];for(const x of arr)write(n,x)}state.db.run('COMMIT');await saveDB();await refresh();go('home');notify('Backup restaurado.')}catch(e){try{state.db.run('ROLLBACK')}catch{}notify('Não foi possível restaurar este backup.');console.error(e)}}
async function resetData(){if(!confirm('Apagar todos os produtos, vendas, clientes e movimentos? Esta ação não pode ser desfeita.'))return;for(const n of ['products','sales','customers','moves','expenses'])state.db.run('DELETE FROM '+n);await saveDB();await refresh();go('home');notify('Dados apagados.')}
async function chooseFolder(){if(!window.showDirectoryPicker)return notify('Este navegador não permite escolher uma pasta.');try{state.folder=await window.showDirectoryPicker({mode:'readwrite'});await kvPut('folder-handle',state.folder);await saveDB();notify('Pasta de cópia configurada.')}catch(e){if(e.name!=='AbortError')notify('Não foi possível escolher a pasta.')}}
async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}if(/iphone|ipad|ipod/i.test(navigator.userAgent))notify('No Safari: Partilhar → Adicionar ao ecrã principal.');else notify('Usa o menu do navegador e escolhe “Instalar aplicação”.')}
function handleClick(e){const b=e.target.closest('[data-go],[data-action],[data-add],[data-inc],[data-dec],[data-edit-product],[data-adjust],[data-customer],[data-sale]');if(!b)return;
if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.sale){const s=state.sales.find(x=>x.id===b.dataset.sale);if(s)saleDetails(s);return}if(b.dataset.customer){const c=state.customers.find(x=>x.id===b.dataset.customer);if(c)customerDetails(c);return}
if(b.dataset.add){const p=state.products.find(x=>x.id===b.dataset.add),line=state.cart.find(x=>x.id===p?.id);if(!p)return;if(line){if(line.qty>=p.stock)return notify('Stock insuficiente.');line.qty++}else state.cart.push({...p,qty:1,delivery:'pending'});render();return}
if(b.dataset.inc||b.dataset.dec){const id=b.dataset.inc||b.dataset.dec,line=state.cart.find(x=>x.id===id);if(!line)return;if(b.dataset.inc){const p=state.products.find(x=>x.id===id);if(line.qty>=p.stock)return notify('Stock insuficiente.');line.qty++}else{line.qty--;if(line.qty<=0)state.cart=state.cart.filter(x=>x.id!==id)}render();return}
if(b.dataset.editProduct){productForm(state.products.find(x=>x.id===b.dataset.editProduct));return}if(b.dataset.adjust){adjustForm(state.products.find(x=>x.id===b.dataset.adjust));return}
const a=b.dataset.action;if(!a)return;
if(a==='home')go('home');if(a==='new-product')productForm();if(a==='new-customer')customerForm();if(a==='close-sheet')closeSheet();if(a==='finish-sale')finishSale();if(a==='clear-cart'){state.cart=[];render()}if(a==='backup')backup();if(a==='export-csv')csv();if(a==='print')window.print();if(a==='choose-folder-again')chooseFolder();if(a==='reset')resetData();
}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{if(e.target.id==='search-products'||e.target.id==='search-customers'||e.target.id==='search-sell'){state.query=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById(e.target.id);if(next){next.focus();next.setSelectionRange(pos,pos)}}});
document.addEventListener('change',e=>{if(e.target.dataset.cartDelivery){const x=state.cart.find(x=>x.id===e.target.dataset.cartDelivery);if(x)x.delivery=e.target.value}if(e.target.id==='restore-file'&&e.target.files[0])restore(e.target.files[0])});
document.addEventListener('submit',async e=>{if(e.target.id==='settings-form'){e.preventDefault();const f=new FormData(e.target);state.cfg={business:f.get('business').trim(),currency:f.get('currency'),minimum:+f.get('minimum')};write('settings',{id:'main',value:state.cfg});await saveDB();await refresh();render();notify('Definições guardadas.')}});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
$('#install-btn').onclick=installApp;
async function start(){try{$('#app').innerHTML='<div class="panel">A preparar o Orbe…</div>';await initDB();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){console.error(e);$('#app').innerHTML='<div class="panel"><h2>Não foi possível iniciar o Orbe</h2><p class="sub">Verifica a ligação à internet na primeira abertura e tenta novamente. Os dados locais não foram apagados.</p><button class="btn primary" onclick="location.reload()">Tentar novamente</button></div>'}}
$('#device-storage').onclick=async()=>{await openKV();await kvPut('storage-mode','device');$('#welcome').style.display='none';await start()};
if(window.showDirectoryPicker){$('#folder-storage').style.display='block';$('#folder-storage').onclick=async()=>{try{await openKV();state.folder=await window.showDirectoryPicker({mode:'readwrite'});await kvPut('folder-handle',state.folder);await kvPut('storage-mode','folder');$('#welcome').style.display='none';await start()}catch(e){if(e.name!=='AbortError')notify('Não foi possível escolher a pasta.')}}}
(async()=>{try{await openKV();const mode=await kvGet('storage-mode');if(mode){$('#welcome').style.display='none';await start()}else $('#welcome').style.display='flex'}catch(e){console.error(e);$('#welcome').style.display='flex'}})();
})();</script>
</body></html>
